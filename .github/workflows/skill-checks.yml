name: Skill contract checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill structure and documented quality checks
        run: python3 scripts/check_skill.py
